# Dataset sources: versions, routes, and the selection each analysis needs.
#
# Which provinces matter is a property of this study, not of the fetch layer,
# so the province filter lives here and src/fetch/ reads it rather than
# containing it.

scidb_rice:
  product: High-resolution distribution maps of single-season rice in China
  doi: 10.57760/sciencedb.06963

  # The 32-character id the DOI resolves to. Recorded so a fetch can skip the
  # resolver hop; src/fetch/scidb.resolve_doi() re-derives it when needed.
  dataset_id: b07f90ea5f0c4e359fa4119a0030f9da

  # The record is currently at V8, published 2022-12-29 and last updated
  # 2026-02-27. The version MUST be passed with its "V" prefix: Science Data
  # Bank answers HTTP 200 with a valid but entirely empty Croissant document
  # for a bare "8", so a missing prefix yields no files and no error.
  version: V8

  licence: CC BY 4.0
  licence_url: https://creativecommons.org/licenses/by/4.0/
  citation: >-
    Shen, R., Pan, B., Peng, Q., Dong, J., Chen, X., Zhang, X., Ye, T.,
    Huang, J., and Yuan, W.: High-resolution distribution maps of
    single-season rice in China from 2017 to 2022, Earth System Science Data,
    15, 3203-3222, 2023. doi:10.5194/essd-15-3203-2023

  # Anonymous public Croissant export. No account, session or cookie. The
  # authenticated API routes are not usable and are not listed here.
  base_url: https://www.scidb.cn/api/gin-sdb-croissant/public/exportCroissant

  destination: data/raw/scidb_rice

  # Matched case-insensitively against each filename. Filenames take the form
  # classified-<Province>-<year>-middle_rice-WGS84-v<version>.tif
  provinces:
    - Anhui
    - Zhejiang
    - Jiangsu
    - Shanghai

glorice:
  product: GloRice (I) gridded paddy rice annual distribution, physical area, Extensive
  doi: 10.6084/m9.figshare.27965832.v2

  # The DOI encodes both; recorded so a fetch can skip the resolver hop.
  # src/fetch/figshare.article_id_from_doi() re-derives them offline.
  article_id: 27965832
  version: 2

  licence: CC BY 4.0
  licence_url: https://creativecommons.org/licenses/by/4.0/
  # Verified against Crossref, not against the figshare author field, which
  # lists two of six authors in reverse order. See notes/decisions.md.
  citation: >-
    Xie, H., Li, J., Li, T., Lu, X., Hu, Q., and Qin, Z. (2025), GloRice, a
    global rice database (v1.0): I. Gridded paddy rice annual distribution
    from 1961 to 2021, Scientific Data 12, 182,
    doi:10.1038/s41597-025-04483-1

  api_base: https://api.figshare.com/v2
  destination: data/raw/glorice

  # The archive holds one netCDF per year for 1961 to 2021. Only these are
  # extracted: 2000 and 2010 are the thesis backcast years, 2017 to 2021 the
  # window shared with the NESDC rice product. Which years matter is a study
  # choice, so it lives here rather than in the fetch module.
  archive: GloRice-phsc-Ex.zip
  years:
    - 2000
    - 2010
    - 2017
    - 2018
    - 2019
    - 2020
    - 2021

gaia:
  product: GAIA annual global artificial impervious area, 30 m
  doi: 10.6084/m9.figshare.27245775.v1

  # The DOI encodes both; src/fetch/figshare.article_id_from_doi() re-derives
  # them offline.
  article_id: 27245775
  version: 1

  licence: CC BY 4.0
  licence_url: https://creativecommons.org/licenses/by/4.0/
  citation: >-
    Gong, P., Li, X., Wang, J., Bai, Y., Chen, B., Hu, T., Liu, X., Xu, B.,
    Yang, J., Zhang, W., and Zhou, Y. (2020), Annual maps of global artificial
    impervious area (GAIA) between 1985 and 2018, Remote Sensing of
    Environment, 236, 111510, doi:10.1016/j.rse.2019.111510

  api_base: https://api.figshare.com/v2
  destination: data/raw/gaia

  # The archive is 2,302,456,975 bytes and is NOT internally addressable over
  # this route, so the whole 2.3 GB must be fetched to reach any tile. It is
  # deleted after extraction; see scripts/fetch_gaia.py.
  archive: GAIA_1985_2022.zip

  # Facts a reader of this config needs, recorded here because they otherwise
  # live only in notes/decisions.md:
  #   - the archive is named GAIA_1985_2022.zip but the data stops at 2021;
  #     the readme's own temporal line reads 1985 to 2021
  #   - pixel values encode the year a pixel first became impervious, counting
  #     DOWNWARD: year = 2023 - value, so 2 is 2021 and 38 is 1985 and before
  #   - value 1 is never used, across the 3,105,244,301 pixels checked
  #   - nodata is -128 and is undocumented in the product readme, which lists
  #     only 0 and 2 through 38
  #
  # Tiles are listed as explicit filenames rather than as the longitude and
  # latitude corners they encode. The corners are the 5-degree cells with
  # upper-left corners at 110/115/120 east by 30/35/40 north, which is the
  # readable form, but the fetch layer selects members by filename and
  # reconstructing "GAIA_1985_2022_{lon}_{lat}.tif" in code would put the
  # product's naming convention into the fetch module, which is what config is
  # here to avoid. A filename that stops matching after a re-release fails
  # loudly; a corner list would quietly build a name that no longer exists.
  tiles:
    - GAIA_1985_2022_110_30.tif
    - GAIA_1985_2022_110_35.tif
    - GAIA_1985_2022_110_40.tif
    - GAIA_1985_2022_115_30.tif
    - GAIA_1985_2022_115_35.tif
    - GAIA_1985_2022_115_40.tif
    - GAIA_1985_2022_120_30.tif
    - GAIA_1985_2022_120_35.tif
    - GAIA_1985_2022_120_40.tif

s5p:
  product: Sentinel-5P TROPOMI Level 2 methane
  # The MEEO mirror serves the operational products over plain HTTPS with no
  # credentials. Copernicus Data Space carries the same granules but requires
  # authentication to download, so it cannot run from a fresh clone.
  base_url: https://meeo-s5p.s3.amazonaws.com
  stream: RPRO          # OFFL, NRTI, RPRO or COGT; RPRO is the reprocessed stream
  product_type: L2__CH4___
  destination: data/raw/s5p

  # There is NO usable checksum on this route. Every S3 ETag observed is a
  # multipart tag with a -N suffix, which is an MD5 of the part MD5s rather
  # than of the object, and the part size is not published. Verification is
  # therefore structural only: the file must open as netCDF4 and hold a
  # PRODUCT group with the expected variables. That is weaker than the MD5
  # verification the figshare and Science Data Bank routes get.

  # Each orbit is published at more than one processor version; a day of
  # L2__CH4___ holds 28 keys for 14 orbits. src/fetch/s5p.latest_per_orbit()
  # keeps the highest version, otherwise the download doubles and a composite
  # mixes two reconstructions of the same overpass.

  bounding_box:         # west, south, east, north
    west: 114.8
    south: 27.0
    east: 122.6
    north: 35.2

  # 0.25 degree gives 33 by 31 cells over that box. The resolution was chosen
  # because coverage supports it: pooled over 36 sampled granules, 56.11
  # percent of the 1,023 cells received at least one sounding at 0.25 degree
  # against 32.91 percent of 6,396 cells at 0.1 degree.
  grid_resolution_deg: 0.25

  # Recommended threshold is 0.5. In this region qa_value is quantised to the
  # top bin, so >= 0.5 and >= 0.75 select identical soundings, 5,347 each
  # across the 36 granules sampled. 0.75 therefore costs nothing here and is
  # the stricter statement. qa_value is stored uint8 with scale_factor 0.01,
  # so 0.75 is a stored value of 75 and 0.5 is 50; compare in stored units.
  qa_threshold: 0.75

  # Fill values MUST be read from each variable's own _FillValue attribute and
  # never assumed. For the methane variables it is 9.969209968386869e+36 and
  # for qa_value it is 255, but those are properties of the file, not of the
  # product.
  variables:
    primary: methane_mixing_ratio_bias_corrected
    secondary: methane_mixing_ratio
    quality: qa_value
    latitude: latitude
    longitude: longitude

  # Support-data fields gridded alongside methane. Which covariates matter is a
  # study choice, so the set lives here rather than in the code.
  #
  # Wind is co-located per sounding inside the granule, interpolated to the
  # overpass by the processor. That is why no ERA5 registration is needed and
  # no separate download exists: the meteorology arrives with the retrieval it
  # belongs to, already matched in space and time. Both alternatives are shut
  # anyway -- ERA5 through the CDS API and CAMS through ADS each return 401 to
  # an unauthenticated retrieve, and neither offers an anonymous route.
  #
  # These fields sit in three different subgroups of PRODUCT, so each carries
  # its own group path. Assuming one location would find the winds and silently
  # miss albedo and the viewing angles.
  #
  # A covariate NEVER gates a sounding. Only 3.4 percent of in-box soundings
  # carry a valid surface_albedo_SWIR, because albedo is written only where the
  # retrieval got far enough, so folding it into the validity mask would throw
  # away 96.6 percent of the methane record. Each covariate is read on the
  # soundings methane already selected and accumulated into a count of its own.
  covariates:
    # Meteorology, co-located per sounding.
    - name: eastward_wind
      group: PRODUCT/SUPPORT_DATA/INPUT_DATA
    - name: northward_wind
      group: PRODUCT/SUPPORT_DATA/INPUT_DATA
    # Albedo is a confounder test, not a predictor. Reconnaissance measured
    # median surface_albedo_SWIR of 0.1058 on valid soundings against 0.0621 on
    # invalid ones, retrieval failure concentrates over dark surfaces, and the
    # literature reports a seasonal surface-albedo bias in TROPOMI methane over
    # agricultural land. Paddies flood on the same seasonal cycle as their
    # methane, so albedo and rice are confounded by construction.
    - name: surface_albedo_SWIR
      group: PRODUCT/SUPPORT_DATA/DETAILED_RESULTS
    - name: surface_albedo_NIR
      group: PRODUCT/SUPPORT_DATA/DETAILED_RESULTS
    # Illumination and terrain, both of which drive retrieval quality.
    - name: solar_zenith_angle
      group: PRODUCT/SUPPORT_DATA/GEOLOCATIONS
    - name: surface_altitude
      group: PRODUCT/SUPPORT_DATA/INPUT_DATA
    - name: surface_pressure
      group: PRODUCT/SUPPORT_DATA/INPUT_DATA

  # 2018 is the study year and cannot be served any other way: Earth Engine's
  # L3 CH4 collection begins 2019-02-08.
  start_date: 2018-01-01
  end_date: 2018-12-31

gisa:
  product: GISA global impervious surface area, 30 m, 1972-2019
  # Wuhan University serves the whole bundle over plain HTTP with no
  # credentials. GISA's documented per-tile links go through Zenodo, which
  # returns 403 at the network level from this host, so this is the only route.
  url: http://irsip.whu.edu.cn/resv2/GISA_tif.zip
  destination: data/raw/gisa
  archive: GISA_tif.zip
  archive_bytes: 882324389
  archive_sha256: 0f5476e39ec7762cea39dbcfd0ccdbd9474db32dc83666e12d284e1227da9a82

  licence: not stated on the download page; the product is described as freely
    available for research in the paper below
  citation: >-
    Huang, X., Li, J., Yang, J., Zhang, Z., Li, D., and Liu, X. (2021), 30 m
    global impervious surface area dynamics and urban expansion pattern
    observed by Landsat satellites: From 1972 to 2019, Science China Earth
    Sciences, 64, 1922-1933, doi:10.1007/s11430-020-9797-9

  # WHAT THE FILENAMES DO NOT TELL YOU. The bundle holds 257 tiles named
  # urban_1.tif to urban_257.tif inside a GISA_tif/ directory. No filename
  # carries a version, a year or a coordinate, so the release cannot be
  # identified from the names and the tiles must be selected by reading each
  # one's georeferencing. Tiles are 10 degrees square, not the 5 degrees GAIA
  # uses, and the four covering the study box are listed below.
  tiles:
    - urban_205.tif        # 110-120 E, 20-30 N
    - urban_206.tif        # 110-120 E, 30-40 N
    - urban_217.tif        # 120-130 E, 20-30 N
    - urban_218.tif        # 120-130 E, 30-40 N

  # ENCODING, MEASURED not assumed, over 5,507,866,225 pixels in those four
  # tiles. Values 0 to 37 are present and nothing above 37. 0 is
  # non-impervious, 96.23 percent of pixels. Values 1 to 37 are the year a
  # pixel first became impervious, counting UPWARD from the oldest:
  #   [1972, 1978, 1985, 1986, 1987, ... 2018, 2019] -> [1, 2, 3, 4, 5, ... 36, 37]
  # This is the REVERSE of GAIA, which counts downward via year = 2023 - value.
  # Extent as of 2018 is therefore 1 <= value <= 36, which is
  # src.landcover.between(1, 36). at_least(36) would select only what was built
  # in 2018 and 2019; at_most(36) would count non-impervious pixels as
  # impervious. Both produce a plausible raster of the wrong thing.
  year_first_impervious_min: 1972
  year_values_ascend: true
  extent_2018_selector: between(1, 36)

  # Pixel size is 0.00026949458523585647 degrees, matching the documented
  # 0.000269494585235856472. CRS EPSG:4326, dtype uint8, and NO declared
  # nodata, the same situation as GAIA and the NESDC rice rasters.
  pixel_size_deg: 0.00026949458523585647
  nodata: null
