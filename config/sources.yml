# Dataset sources: versions, routes, and the selection each analysis needs.
#
# Which provinces matter is a property of this study, not of the fetch layer,
# so the province filter lives here and src/fetch/ reads it rather than
# containing it.

scidb_rice:
  product: High-resolution distribution maps of single-season rice in China
  doi: 10.57760/sciencedb.06963

  # The 32-character id the DOI resolves to. Recorded so a fetch can skip the
  # resolver hop; src/fetch/scidb.resolve_doi() re-derives it when needed.
  dataset_id: b07f90ea5f0c4e359fa4119a0030f9da

  # The record is currently at V8, published 2022-12-29 and last updated
  # 2026-02-27. The version MUST be passed with its "V" prefix: Science Data
  # Bank answers HTTP 200 with a valid but entirely empty Croissant document
  # for a bare "8", so a missing prefix yields no files and no error.
  version: V8

  licence: CC BY 4.0
  licence_url: https://creativecommons.org/licenses/by/4.0/
  citation: >-
    Shen, R., Pan, B., Peng, Q., Dong, J., Chen, X., Zhang, X., Ye, T.,
    Huang, J., and Yuan, W.: High-resolution distribution maps of
    single-season rice in China from 2017 to 2022, Earth System Science Data,
    15, 3203-3222, 2023. doi:10.5194/essd-15-3203-2023

  # Anonymous public Croissant export. No account, session or cookie. The
  # authenticated API routes are not usable and are not listed here.
  base_url: https://www.scidb.cn/api/gin-sdb-croissant/public/exportCroissant

  destination: data/raw/scidb_rice

  # Matched case-insensitively against each filename. Filenames take the form
  # classified-<Province>-<year>-middle_rice-WGS84-v<version>.tif
  provinces:
    - Anhui
    - Zhejiang
    - Jiangsu
    - Shanghai

glorice:
  product: GloRice (I) gridded paddy rice annual distribution, physical area, Extensive
  doi: 10.6084/m9.figshare.27965832.v2

  # The DOI encodes both; recorded so a fetch can skip the resolver hop.
  # src/fetch/figshare.article_id_from_doi() re-derives them offline.
  article_id: 27965832
  version: 2

  licence: CC BY 4.0
  licence_url: https://creativecommons.org/licenses/by/4.0/
  # Verified against Crossref, not against the figshare author field, which
  # lists two of six authors in reverse order. See notes/decisions.md.
  citation: >-
    Xie, H., Li, J., Li, T., Lu, X., Hu, Q., and Qin, Z. (2025), GloRice, a
    global rice database (v1.0): I. Gridded paddy rice annual distribution
    from 1961 to 2021, Scientific Data 12, 182,
    doi:10.1038/s41597-025-04483-1

  api_base: https://api.figshare.com/v2
  destination: data/raw/glorice

  # The archive holds one netCDF per year for 1961 to 2021. Only these are
  # extracted: 2000 and 2010 are the thesis backcast years, 2017 to 2021 the
  # window shared with the NESDC rice product. Which years matter is a study
  # choice, so it lives here rather than in the fetch module.
  archive: GloRice-phsc-Ex.zip
  years:
    - 2000
    - 2010
    - 2017
    - 2018
    - 2019
    - 2020
    - 2021

gaia:
  product: GAIA annual global artificial impervious area, 30 m
  doi: 10.6084/m9.figshare.27245775.v1

  # The DOI encodes both; src/fetch/figshare.article_id_from_doi() re-derives
  # them offline.
  article_id: 27245775
  version: 1

  licence: CC BY 4.0
  licence_url: https://creativecommons.org/licenses/by/4.0/
  citation: >-
    Gong, P., Li, X., Wang, J., Bai, Y., Chen, B., Hu, T., Liu, X., Xu, B.,
    Yang, J., Zhang, W., and Zhou, Y. (2020), Annual maps of global artificial
    impervious areas (GAIA) between 1985 and 2018, Remote Sensing of
    Environment, 236, 111510, doi:10.1016/j.rse.2019.111510

  api_base: https://api.figshare.com/v2
  destination: data/raw/gaia

  # The archive is 2,302,456,975 bytes and is NOT internally addressable over
  # this route, so the whole 2.3 GB must be fetched to reach any tile. It is
  # deleted after extraction; see scripts/fetch_gaia.py.
  archive: GAIA_1985_2022.zip

  # Facts a reader of this config needs, recorded here because they otherwise
  # live only in notes/decisions.md:
  #   - the archive is named GAIA_1985_2022.zip but the data stops at 2021;
  #     the readme's own temporal line reads 1985 to 2021
  #   - pixel values encode the year a pixel first became impervious, counting
  #     DOWNWARD: year = 2023 - value, so 2 is 2021 and 38 is 1985 and before
  #   - value 1 is never used, across the 3,105,244,301 pixels checked
  #   - nodata is -128 and is undocumented in the product readme, which lists
  #     only 0 and 2 through 38
  #
  # Tiles are listed as explicit filenames rather than as the longitude and
  # latitude corners they encode. The corners are the 5-degree cells with
  # upper-left corners at 110/115/120 east by 30/35/40 north, which is the
  # readable form, but the fetch layer selects members by filename and
  # reconstructing "GAIA_1985_2022_{lon}_{lat}.tif" in code would put the
  # product's naming convention into the fetch module, which is what config is
  # here to avoid. A filename that stops matching after a re-release fails
  # loudly; a corner list would quietly build a name that no longer exists.
  tiles:
    - GAIA_1985_2022_110_30.tif
    - GAIA_1985_2022_110_35.tif
    - GAIA_1985_2022_110_40.tif
    - GAIA_1985_2022_115_30.tif
    - GAIA_1985_2022_115_35.tif
    - GAIA_1985_2022_115_40.tif
    - GAIA_1985_2022_120_30.tif
    - GAIA_1985_2022_120_35.tif
    - GAIA_1985_2022_120_40.tif
