- artefact: data/processed/analysis_grid_2018.csv
  command: python scripts/build_analysis_grid.py --rice-source nesdc --write
  label: analysis grid
  cost: about 3 minutes over the local rice and urban rasters
  seconds: 180
  inputs: local
  compare: bytes
  verified: on_local
  note: --rice-source nesdc is what the committed file was built from and needs the FTP rasters.
    --rice-source scidb is the anonymous route and reproduces every column except rice_fraction_combined,
    which it lowers in 190 rows because that product folds the double-season class into background.
    Both are legitimate; the committed file is the nesdc one.
