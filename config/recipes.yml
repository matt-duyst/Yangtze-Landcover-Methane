# How every committed artefact is regenerated, and how that claim is checked.
#
# This file exists because two regeneration recipes drifted from the artefacts
# they claim to produce, and nothing noticed. A recipe written only as prose is
# a claim no code checks. Here it is data, tests/test_recipes.py executes it,
# and the table in README.md is generated from it rather than maintained beside
# it.
#
# Fields
#   artefact  committed file the command produces, repository-relative
#   command   exactly what to run, from the repository root
#   label     short name, used in the README table
#   cost      human-readable, shown in the README table
#   seconds   measured wall-clock, for tiering
#   inputs    committed  every input is in the repository; runs on a fresh clone
#             local      needs data/raw or data/interim, which are gitignored
#             network    needs a large fetch; never run by the test suite
#   compare   bytes      output must be byte-identical to the committed file
#             subset     output reproduces a documented subset of the rows
#   out_flag  the flag that redirects this artefact, where the script writes
#             more than one file and a bare --out would be ambiguous
#   verified  continuously  a test runs the command and diffs, every suite run
#             on_local      the same, but only where the local inputs exist
#             on_demand     too expensive to run; checksum plus a dated record
#             unregenerable no command produces it; provenance recorded instead
#
# Adding a committed artefact without adding it here fails
# test_every_committed_artefact_has_a_recipe. That is deliberate: an artefact
# with no recipe is the strongest form of drift, and this repository had one.

recipes:
- artefact: data/processed/methane_composite_2018.tif
  command: python scripts/compute_methane_composite.py --checkpoint data/interim/extent_2018.npz
    --export data/processed/methane_composite_2018 --export-csv data/processed/methane_coverage_2018.csv
  label: 2018 methane composite
  cost: 28.9 GB and about two hours to build the checkpoint; seconds to export from it
  seconds: 1
  inputs: network
  compare: bytes
  verified: on_demand
  note: 'The export is instant from a checkpoint. What is expensive is building the checkpoint:
    compute_methane_composite.py --run --max-hours 3, which streams 28.9 GB one granule at
    a time. The checkpoint is gitignored, so this cannot be verified on a fresh clone.'
  sha256: 393e365a8f26c7c142bea08b056a2290482b1401e4d8ff46d5b135a614da9b24
  last_verified: '2026-09-04'
  last_verified_by: the extent re-run, which executed compute_methane_composite.py --run end
    to end over all 578 granules and exported from the result
