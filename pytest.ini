[pytest]
# The default run is the fast suite: every test whose inputs are committed, so
# it passes on a fresh clone.
#
# The `slow` marker covers recipe verifications that need data/raw or
# data/interim, both gitignored. They take minutes, mostly rebuilding the
# analysis grid from 1.7 GB of rice rasters, and they skip themselves with a
# reason where the inputs are absent. Run them with
#
#     python -m pytest -m slow
#
# A test nobody runs is not a test, so that invocation is documented in
# README.md as well as here.
markers =
    slow: needs gitignored local data; excluded from the default run
addopts = -m "not slow"
